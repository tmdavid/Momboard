name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy app/

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests (SQLite)
        run: pytest --tb=short -q
        env:
          DATABASE_URL: "sqlite+aiosqlite://"
          SESSION_SECRET: "ci-test-secret"
          ENV: test

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: momboard
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: momboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: "postgresql+asyncpg://momboard:testpass@localhost:5432/momboard_test"
      - name: Run tests (Postgres)
        run: pytest --tb=short -q
        env:
          DATABASE_URL: "postgresql+asyncpg://momboard:testpass@localhost:5432/momboard_test"
          SESSION_SECRET: "ci-test-secret"
          ENV: test
