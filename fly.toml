# Fly.io configuration for MomBoard
# See https://fly.io/docs/reference/configuration/

app = "momboard"
primary_region = "cdg"  # Paris, EU

[build]

[env]
  ENV = "production"
  PORT = "8080"
  DATABASE_URL = "sqlite+aiosqlite:///data/momboard.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

# Persistent volume for SQLite database + backups
[[mounts]]
  source = "momboard_data"
  destination = "/data"
  initial_size = "1"  # 1 GB

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
