version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/momboard.db
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/healthz'); exit(0 if r.status_code == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Optional: Local LLM via Ollama (activate with: docker compose --profile local-llm up)
  ollama:
    image: ollama/ollama:0.9.0
    profiles:
      - local-llm
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G

  # Model bootstrap: pulls the default model then exits
  ollama-bootstrap:
    image: ollama/ollama:0.9.0
    profiles:
      - local-llm
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "qwen3:8b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # Optional: Postgres for production-like local dev.
  # Before enabling, change the Dockerfile install to `pip install --no-cache-dir '.[postgres]'`,
  # rebuild, then set DATABASE_URL=postgresql+asyncpg://momboard:secret@db:5432/momboard
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: momboard
  #     POSTGRES_PASSWORD: secret
  #     POSTGRES_DB: momboard
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U momboard"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

volumes:
  ollama_data:
